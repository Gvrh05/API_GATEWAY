apiVersion: 1
datasources:
  - name: postgres-analytics
    uid: PD_ANALYTICS
    type: postgres
    access: proxy
    url: postgres:5432
    database: postgres
    user: postgres
    secureJsonData:
      password: postgres
    jsonData:
      sslmode: disable
      maxOpenConns: 10
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: true
